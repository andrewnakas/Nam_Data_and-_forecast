name: Fetch NAM Data and Deploy to GitHub Pages

on:
  # Run every 6 hours (NAM updates at 00, 06, 12, 18 UTC)
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to main
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnetcdf-dev libhdf5-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install xarray netCDF4 numpy requests siphon

    - name: Fetch NAM data for preset locations
      run: |
        python fetch_data.py
      continue-on-error: true

    - name: Commit data files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/data/*.json || true
        git diff --staged --quiet || git commit -m "Update NAM forecast data - $(date -u +"%Y-%m-%d %H:%M UTC")"
        git push || true
      continue-on-error: true

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
