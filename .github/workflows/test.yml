name: Test NAM Weather App

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnetcdf-dev libhdf5-dev

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m unittest test_app.py -v

    - name: Test Flask app startup
      run: |
        timeout 10 python app.py &
        PID=$!
        sleep 5
        curl -f http://localhost:5000/api/status || echo "NAM data may be unavailable"
        kill $PID || true

    - name: Check code syntax
      run: |
        python -m py_compile app.py
        python -m py_compile test_app.py

    - name: Verify project structure
      run: |
        test -f app.py || exit 1
        test -f requirements.txt || exit 1
        test -f README.md || exit 1
        test -d templates || exit 1
        test -d static/css || exit 1
        test -d static/js || exit 1
        test -f templates/index.html || exit 1
        test -f static/css/style.css || exit 1
        test -f static/js/app.js || exit 1
        echo "All required files present"
